<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinly | All Contacts</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <div class="app-layout">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <!-- Brand -->
            <div class="brand">
                <i class="bi bi-person-vcard-fill"></i>
                <span>Kinly</span>
            </div>


            <div class="sidebar-content">

                <!-- New Contact Button -->
                <button class="btn new-contact-btn" type="button" data-bs-toggle="modal" data-bs-target="#contactModal">

                    <i class="bi bi-plus"></i>
                    New Contact

                </button>


                <!-- Statistics -->
                <div class="stats-list">

                    <div class="stat-card">
                        <div class="stat-number total-number" id="totalContacts">
                            0
                        </div>

                        <div class="stat-label">
                            Total Contacts
                        </div>
                    </div>


                    <div class="stat-card">
                        <div class="stat-number favorite-number" id="favoriteContacts">
                            0
                        </div>

                        <div class="stat-label">
                            Favorites
                        </div>
                    </div>


                    <div class="stat-card">
                        <div class="stat-number emergency-number" id="emergencyContacts">
                            0
                        </div>

                        <div class="stat-label">
                            Emergency
                        </div>
                    </div>

                </div>

            </div>


            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <i class="bi bi-shield-check"></i>
                Data stored locally in your browser.
            </div>

        </aside>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">

            <!-- Header -->
            <header class="topbar">

                <div class="page-heading">

                    <h1>All Contacts</h1>

                    <p>
                        Manage your personal and professional connections
                    </p>

                </div>


                <!-- Search -->
                <div class="search-wrap">

                    <i class="bi bi-search"></i>

                    <input type="search" id="searchInput" class="form-control search-input"
                        placeholder="Search by name or phone..." aria-label="Search contacts">

                </div>

            </header>



            <!-- =========================
                 CONTACTS TABLE
            ========================== -->




            <div class="contacts-table-container">


                <!-- Empty State -->
                <div class="empty-state" id="emptyState">

                    <i class="bi bi-person-lines-fill"></i>

                    <h4>No contacts yet</h4>

                    <p>
                        Start building your network by adding your first contact.
                    </p>

                </div>

            </div>

        </main>

    </div>



    <!-- =========================
         ADD NEW CONTACT MODAL
    ========================== -->

    <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">


        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable contact-modal-dialog">

            <div class="modal-content contact-modal">


                <!-- Modal Header -->
                <div class="modal-header contact-modal-header">

                    <div>

                        <h5 class="modal-title" id="contactModalLabel">
                            Add New Contact
                        </h5>

                        <p>
                            Save someone's details to your network.
                        </p>

                    </div>


                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>



                <!-- Contact Form -->
                <form id="contactForm" class="modal-body contact-modal-body">


                    <!-- Full Name -->
                    <div class="mb-3">

                        <label for="fullName" class="form-label">
                            Full Name <span class="required">*</span>
                        </label>

                        <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required>

                        <div id="nameMessage" class="validation-message"></div>

                    </div>


                    <!-- Phone Number -->
                    <div class="mb-3">

                        <label for="phoneNumber" class="form-label">
                            Phone Number <span class="required">*</span>
                        </label>

                        <input type="tel" class="form-control" id="phoneNumber" placeholder="+1 (555) 000-0000"
                            required>

                        <div id="phoneMessage" class="validation-message"></div>

                    </div>


                    <!-- Email Address -->
                    <div class="mb-3">

                        <label for="emailAddress" class="form-label">
                            Email Address
                        </label>

                        <input type="email" class="form-control" id="emailAddress" placeholder="john@example.com">

                        <div id="emailMessage" class="validation-message"></div>

                    </div>



                    <!-- Address -->
                    <div class="mb-3">

                        <label for="address" class="form-label">
                            Address
                        </label>

                        <input type="text" class="form-control" id="address" placeholder="City, Country">

                        <div id="addressMessage" class="validation-message"></div>

                    </div>



                    <!-- Group -->
                    <div class="mb-3">

                        <label for="contactGroup" class="form-label">
                            Group
                        </label>

                        <select class="form-select" id="contactGroup">

                            <option value="" selected disabled>
                                Select a group
                            </option>

                            <option value="Family">Family</option>
                            <option value="Friends">Friends</option>
                            <option value="Work">Work</option>
                            <option value="Other">Other</option>

                        </select>

                        <div id="groupMessage" class="validation-message"></div>

                    </div>



                    <!-- Notes -->
                    <div class="mb-3">

                        <label for="notes" class="form-label">
                            Notes
                        </label>

                        <textarea class="form-control" id="notes" rows="3"
                            placeholder="Add some notes about this contact...">
                        </textarea>

                        <div id="notesMessage" class="validation-message"></div>

                    </div>



                    <!-- Favorite and Emergency -->
                    <div class="contact-options">


                        <!-- Favorite -->
                        <div class="form-check contact-check">

                            <input class="form-check-input" type="checkbox" id="isFavorite">

                            <label class="form-check-label" for="isFavorite">

                                <i class="bi bi-star-fill favorite-icon"></i>
                                Favorite

                            </label>

                        </div>



                        <!-- Emergency -->
                        <div class="form-check contact-check">

                            <input class="form-check-input" type="checkbox" id="isEmergency">

                            <label class="form-check-label" for="isEmergency">

                                <i class="bi bi-heart-pulse-fill emergency-icon"></i>
                                Emergency

                            </label>

                        </div>

                    </div>

                </form>



                <!-- Modal Footer -->
                <div class="modal-footer contact-modal-footer">

                    <button type="button" class="btn cancel-btn" data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button type="submit" form="contactForm" class="btn save-btn">

                        <i class="bi bi-check-lg"></i>
                        Save Contact

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom JavaScript -->
    <script src="Js/script2.js"></script>

</body>

</html>
